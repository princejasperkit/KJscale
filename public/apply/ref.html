<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Application received</title>
  <link rel="stylesheet" href="/css/apply-modal.css">
  <style>
    body {font-family: system-ui, sans-serif; padding: 2rem; max-width: 800px; margin: auto;}
    .card {border-radius:8px; border:1px solid #eaeaea; padding:1.25rem;}
    .ref {font-family: monospace; background:#f7f7f7; padding:.5rem; border-radius:4px; display:inline-block; margin-right:.5rem;}
    button.copy {padding:.4rem .7rem;}
  </style>
</head>
<body>
  <main class="card">
    <h1>Thank you!</h1>
    <p>We have received your application and we will review it in 7-10 business days. We will contact you within this period for the next step of your application.</p>
    <p>Your reference number:</p>
    <div>
      <span id="refNumber" class="ref"></span>
      <button id="copyBtn" class="copy">Copy</button>
    </div>
  </main>
  <script>
    function qs(name){ const p = new URLSearchParams(location.search); return p.get(name); }
    const ref = qs('number') || 'N/A';
    document.getElementById('refNumber').textContent = ref;
    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(ref);
        document.getElementById('copyBtn').textContent = 'Copied!';
        setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy', 2000);
      } catch (err) {
        alert('Copy failed. Your reference: ' + ref);
      }
    });
  </script>
</body>
</html>
