<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Apply - KJScale</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/careers.css">
<style>
  :root{--accent:#0b6cff;--muted:#666;}
  body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;padding:0;background:#f7f8fb;color:#222}
  .container{max-width:820px;margin:32px auto;padding:20px;background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(13,21,34,0.06)}
  h1{margin:0 0 8px;font-size:22px}
  .job-sub{color:var(--muted);margin-bottom:18px}
  form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;font-size:14px;color:#222}
  input[type="text"], input[type="email"], input[type="tel"], textarea, select {
    width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;background:#fff;box-sizing:border-box;
  }
  textarea{grid-column:1 / -1;min-height:120px;resize:vertical}
  .fullwidth{grid-column:1 / -1}
  .actions{display:flex;gap:8px;justify-content:flex-end;grid-column:1 / -1;margin-top:4px}
  .btn{padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-secondary{background:#f1f4f8;border:1px solid:#e0e6ef}
  .note{font-size:13px;color:var(--muted);margin-top:8px}
  @media (max-width:720px){
    form{grid-template-columns:1fr}
    .actions{justify-content:stretch;flex-direction:column}
    .actions .btn{width:100%}
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Apply</h1>
    <div class="job-sub">Applying for: <strong id="job-title">—</strong></div>

    <!-- Change action to your real backend endpoint if needed -->
    <form id="apply-form" action="/apply" method="post" enctype="multipart/form-data" novalidate>
      <label>
        Full name *
        <input name="name" type="text" required placeholder="Jane Doe" />
      </label>

      <label>
        Email *
        <input name="email" type="email" required placeholder="you@example.com" />
      </label>

      <label>
        Phone
        <input name="phone" type="tel" placeholder="+1 555 555 5555" />
      </label>

      <label class="fullwidth">
        Position
        <input id="position-field" name="position" type="text" readonly />
      </label>

      <label class="fullwidth">
        Resume (PDF, DOCX)
        <input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" />
      </label>

      <label class="fullwidth">
        Cover letter (optional)
        <textarea name="cover" placeholder="Tell us why you’re a good fit"></textarea>
      </label>

      <label class="fullwidth" style="font-size:13px">
        <input name="consent" type="checkbox" required /> I consent to my data being used to process this application.
      </label>

      <div class="actions">
        <button type="button" class="btn btn-secondary" id="cancel-btn">Back</button>
        <button type="submit" class="btn btn-primary" id="submit-btn">Submit Application</button>
      </div>

      <div class="note">By submitting you agree to our privacy policy.</div>
    </form>
  </div>

<script>
  // Prefill job from query param
  function getQueryParam(name) {
    return new URLSearchParams(window.location.search).get(name) || '';
  }
  const job = decodeURIComponent(getQueryParam('job') || '').replace(/\+/g,' ');
  document.getElementById('job-title').textContent = job || 'General Application';
  document.getElementById('position-field').value = job || 'General Application';

  document.getElementById('cancel-btn').addEventListener('click', function(){
    if(document.referrer) window.history.back();
    else window.location.href = '/';
  });

  document.getElementById('apply-form').addEventListener('submit', function(e){
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    // If you need client-side required-resume validation, add it here.
  });
</script>
</body>
</html>
